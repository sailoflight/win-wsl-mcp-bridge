[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "win-wsl-mcp-bridge"
dynamic = ["version"]
description = "Bidirectional local bridge for standard MCP stdio servers and workspace artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
win-wsl-mcp-win = "bridge_runtime:win_main"
win-wsl-mcp-wsl = "bridge_runtime:wsl_main"

[tool.setuptools]
py-modules = ["bridge_runtime", "bridge_publisher"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "bridge_runtime.SERVER_VERSION"}
