name: verify

# The blocking gate is `test` plus `package`. Two further jobs run the checks
# that are not yet trustworthy as a gate, non-blockingly, so the signal is kept
# without making every push red:
#
#   * `load-sensitive` — tests whose verdict depends on how much else is
#     running (bounded handler deadlines, a concurrent 404 recovery, spawn /
#     initialize counting, connector liveness under thread load). They pass on
#     an idle host and flake on a saturated 2-core runner. The blocking `test`
#     job skips exactly the named set (`tests/run_offline.py --deterministic-only`);
#     this job runs the whole suite so a real regression is still visible.
#   * `windows` — the Windows leg never passed. Every recorded cause is now
#     fixed: an unclosed `sqlite3` handle blocking temporary-directory removal
#     with `WinError 32`, two loopback socket errors on closed or unconnected
#     sockets, a fixture cleanup deadline, a bridge candidate check that rejected
#     the runner's own `%USERPROFILE%\.claude.json`, and fixture temporary roots
#     that were not their own `resolve()` because the runner sets `TEMP` to an
#     8.3 short name. It stays non-blocking until one run confirms that, then it
#     becomes a hard gate.

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the deterministic suite
        run: python -m tests.run_offline --deterministic-only -v

  load-sensitive:
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the whole suite, including the load-sensitive tests
        run: python -m tests.run_offline -v

  windows:
    # Remove `continue-on-error` once a run is green: that is the only step left
    # between this leg and a hard gate.
    continue-on-error: true
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the deterministic suite
        run: python -m tests.run_offline --deterministic-only -v

  package:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Verify distribution inventories and source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from tests.verify_distribution import verify_distributions
          root = Path.cwd()
          print(verify_distributions(root, next(Path('dist').glob('*.whl')),
                                     next(Path('dist').glob('*.tar.gz'))))
          PY
      - name: Smoke isolated wheel installation
        run: python -m tests.smoke_install dist/*.whl
