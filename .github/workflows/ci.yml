name: verify

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -t . -v

  package:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Verify distribution inventories and source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from tests.verify_distribution import verify_distributions
          root = Path.cwd()
          print(verify_distributions(root, next(Path('dist').glob('*.whl')),
                                     next(Path('dist').glob('*.tar.gz'))))
          PY
      - name: Smoke isolated wheel installation
        run: python -m tests.smoke_install dist/*.whl
