name: verify

# The blocking gate is `test`, `windows`, and `package`. One further job runs the
# checks that are not yet trustworthy as a gate, non-blockingly, so the signal is
# kept without making every push red:
#
#   * `load-sensitive` — tests whose verdict depends on how much else is
#     running (a concurrent 404 recovery, spawn / initialize counting, connector
#     liveness under thread load). They pass on an idle host and flake on a
#     saturated 2-core runner. The blocking jobs skip exactly the named set
#     (`tests/run_offline.py --deterministic-only`); this job runs the whole suite
#     so a real regression is still visible.
#
# The `windows` leg became a gate in run 36990671066 (commit 5f3ba90). Every
# recorded cause of its earlier failures is fixed: an unclosed `sqlite3` handle
# blocking temporary-directory removal with `WinError 32`, two loopback socket
# errors on closed or unconnected sockets, a fixture cleanup deadline, a bridge
# candidate check that rejected the runner's own `%USERPROFILE%\.claude.json`,
# fixture temporary roots that were not their own `resolve()` because the runner
# sets `TEMP` to an 8.3 short name, one scene-setting timeout in a TLS-handshake
# test, and facade deadlines that doubled as a cold-spawn budget (now named
# constants in `tests/test_modern_http_facade.py`). Enabling the gate then caught
# one more: a capacity refusal closed the socket before reading the refused
# request, so on Windows the client's own write was aborted with `WinError 10053`
# and the structured 503 never arrived.

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the deterministic suite
        run: python -m tests.run_offline --deterministic-only -v

  load-sensitive:
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the whole suite, including the load-sensitive tests
        run: python -m tests.run_offline -v

  windows:
    # A hard gate since run 36990671066 (commit 5f3ba90) passed with the same 638
    # tests the blocking `test` job runs, in 264 s against 170 s here, with 13
    # platform-conditional skips.
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the deterministic suite
        run: python -m tests.run_offline --deterministic-only -v

  package:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Verify distribution inventories and source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from tests.verify_distribution import verify_distributions
          root = Path.cwd()
          print(verify_distributions(root, next(Path('dist').glob('*.whl')),
                                     next(Path('dist').glob('*.tar.gz'))))
          PY
      - name: Smoke isolated wheel installation
        run: python -m tests.smoke_install dist/*.whl
